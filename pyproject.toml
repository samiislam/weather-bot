[project]
name = "weather-bot"
version = "0.1.0"
description = "WeatherBot for DLMAIPAIUC01"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.0",
    "ipywidgets>=8.1",
    "huggingface-hub>=1.0",
    "langchain-cli>=0.0.37",
    "sentence-transformers>=5.0",
    "langsmith>=0.14",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "docarray>=0.41",
    "streamlit>=1.66",
    "pydantic>=2.14",
    "datasets>=4.0",
    "pyowm>=3.5",
    "transformers>=5.0",
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "pip-audit",
]

[tool.uv]
package = false
